<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="我们的情侣空间">
  <title>我们的情侣空间</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <header class="hero">
    <p class="eyebrow">OUR LITTLE UNIVERSE</p>
    <h1>我们的情侣空间</h1>
    <p class="since">
      从 <time id="start-date" datetime="2024-05-20">2024 年 5 月 20 日</time> 开始
    </p>
    <p class="counter">我们已经在一起 <strong id="days">0</strong> 天</p>
    <button id="theme-toggle" type="button" aria-pressed="false">切换夜间模式</button>
  </header>

  <main>
    <section class="card">
      <h2>关于我们</h2>
      <p>这里写一小段属于你们的故事。</p>
    </section>

    <section class="card">
      <h2>照片墙</h2>
      <div class="photos">
        <img src="images/photo-1.svg" alt="照片占位图 1">
        <img src="images/photo-2.svg" alt="照片占位图 2">
        <img src="images/photo-3.svg" alt="照片占位图 3">
      </div>
    </section>

    <section class="card">
      <h2>想对你说</h2>
      <p>有些话，只在这里说。</p>
      <button id="note-toggle" type="button">打开悄悄话</button>
      <p id="love-note" hidden>很高兴和你一起，把普通的日子过成纪念日。</p>
    </section>
  </main>

  <footer>
    <p>Made with love by xiaoman905</p>
  </footer>
</body>
</html>
